[project]
name = "aegisnews"
version = "0.1.0"
description = "Secure multimodal news intelligence foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
 "cryptography>=50,<51", "PyJWT[crypto]>=2.15.1,<3",
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
 "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
 "psycopg[binary]>=3.2,<4", "redis>=5,<7", "boto3>=1.35,<2",
 "temporalio>=1.10,<2", "prometheus-client>=0.21,<1",
 "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
 "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]
[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "types-boto3[s3]>=1.35,<2", "pip-audit>=2.8,<3", "jsonschema>=4.23,<5", "types-jsonschema>=4.23,<5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aegis", "apps"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["aegis", "apps/api", "apps/worker", "scripts"]
[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local Compose dependencies", "database: requires PostgreSQL only", "e2e: requires running API and web"]
