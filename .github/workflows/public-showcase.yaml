name: Publish Public Showcase

on:
  workflow_call:
    inputs:
      export_sha256:
        required: true
        type: string
      deploy:
        type: boolean
        default: false
      release_sha256:
        type: string
        default: ""
      preview:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      export_sha256:
        description: Exact SHA-256 printed by the local validate command
        required: true
        type: string
      deploy:
        description: Deploy validated static files to Cloudflare Pages Free
        type: boolean
        default: false
      release_sha256:
        description: Optional signed daily release identity from publication-data
        type: string
        default: ""
      preview:
        description: Deploy a validated preview without changing production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-showcase
  cancel-in-progress: false

jobs:
  publish:
    # Preserve manual publication, but do not assume private Actions are free.
    if: vars.ACTIONS_PAID_USAGE_DISABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_DATASET: ${{ inputs.release_sha256 != '' && '.data/daily/manual.json' || 'apps/showcase/dataset.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.21"
      - run: uv sync --frozen --python 3.12
      - name: Retrieve Exact Signed Daily Release
        if: inputs.release_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release_sha256 }}
        run: uv run python -m scripts.public_showcase state-release --release "$RELEASE" --output "$PUBLIC_DATASET"
      - name: Validate Exact Curated Export
        env:
          EXPECTED_EXPORT_SHA256: ${{ inputs.export_sha256 }}
        run: |
          uv run python -m scripts.public_showcase validate --dataset "$PUBLIC_DATASET" --expected-sha256 "$EXPECTED_EXPORT_SHA256"
          uv run pytest -q tests/unit/test_public_showcase.py tests/unit/test_daily_publication.py tests/unit/test_publication_recovery.py
          uv run python -m scripts.public_showcase build --dataset "$PUBLIC_DATASET"
          uv run python -m scripts.public_showcase audit --dataset "$PUBLIC_DATASET"
          uv run python scripts/scan_secrets.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check Every Route And Browser Verification
        run: |
          pnpm install --frozen-lockfile
          make audit
          pnpm --filter @aegisnews/web exec playwright install --with-deps chromium
          node apps/showcase/check-browser.mjs
      - name: Confirm Deployment Configuration
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DAILY_ENABLED: ${{ vars.DAILY_PUBLICATION_ENABLED }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository variable'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Missing CLOUDFLARE_PAGES_PROJECT repository variable'; exit 1; }
          if [ "$DAILY_ENABLED" = true ] && [ "$PREVIEW" != true ]; then
            echo 'Daily state is authoritative: use Daily Public Publication workflow_dispatch for production.'
            exit 1
          fi
          uv run python -c 'from aegis.showcase.deployment import preflight; preflight()'
      - name: Verify Production Recovery Target Without Changing Production
        if: inputs.deploy && inputs.preview
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          uv run python -m scripts.public_showcase state-read --output .data/daily/preview-parent.json --candidate .data/daily/preview-pending.json
          uv run python -m aegis.showcase.recovery checkpoint --previous .data/daily/preview-parent.json
      - name: Deploy Static Assets Only
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          branch=main
          if [ "$PREVIEW" = true ]; then branch=daily-preview; fi
          npx --yes wrangler@4.151.0 pages deploy apps/showcase/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$branch"
      - name: Verify Actual Public Deployment
        if: inputs.deploy
        env:
          AEGIS_PUBLIC_BASE_URL: ${{ inputs.preview && 'https://daily-preview.aegis-news-showcase.pages.dev' || 'https://aegis-news-showcase.pages.dev' }}
        run: |
          node apps/showcase/check-browser.mjs
          uv run python -m scripts.verify_public_deployment --base-url "$AEGIS_PUBLIC_BASE_URL"
      - name: Record Release Identity
        env:
          EXPORT_SHA: ${{ inputs.export_sha256 }}
        run: |
          echo "Validated export SHA-256: $EXPORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Build commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'No acquisition, inference workers, Docker, Temporal or scheduled tasks were started.' >> "$GITHUB_STEP_SUMMARY"
