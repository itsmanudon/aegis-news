name: MVP CI
env:
  AEGIS_AI_PROFILE: offline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-mvp:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegisnews/web exec playwright install --with-deps chromium
      - run: docker compose --env-file infrastructure/mvp.env.example -p aegis-integration --profile full up --build -d --wait
      - run: docker compose --env-file infrastructure/mvp.env.example -p aegis-integration exec -T api python scripts/mvp_acceptance.py
      - name: Live browser acceptance
        env:
          AEGIS_E2E_EXTERNAL_SERVER: "1"
          AEGIS_LIVE_E2E: "1"
          AEGIS_E2E_BASE_URL: http://127.0.0.1:23000
          AEGIS_E2E_API_URL: http://127.0.0.1:28000
        run: |
          export AEGIS_E2E_TOKEN="$(docker compose --env-file infrastructure/mvp.env.example -p aegis-integration exec -T api python scripts/security_dev.py token --key-id local --role admin --subject browser-demo)"
          export AEGIS_E2E_VIEWER_TOKEN="$(docker compose --env-file infrastructure/mvp.env.example -p aegis-integration exec -T api python scripts/security_dev.py token --key-id local --role viewer --subject browser-viewer)"
          pnpm --filter @aegisnews/web exec playwright test e2e/live.spec.ts
      - if: always()
        run: docker compose --env-file infrastructure/mvp.env.example -p aegis-integration down
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: make check-backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check-web
      - run: pnpm --filter @aegisnews/web exec playwright install --with-deps chromium
      - run: pnpm web:test:e2e
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev_only
          POSTGRES_DB: aegisnews
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisnews"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/verify_migrations.py
      - run: uv run alembic upgrade head
      - run: AEGIS_RUN_INTEGRATION=1 AEGIS_INGESTION_TEST_DATABASE_URL=postgresql+psycopg://aegis:aegis_dev_only@localhost:5432/aegisnews uv run pytest -q -m database
      - run: AEGIS_INGESTION_TEST_DATABASE_URL=postgresql+psycopg://aegis:aegis_dev_only@localhost:5432/aegisnews uv run pytest -q tests/ingestion
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make audit
      - run: uv run python scripts/scan_secrets.py
      - run: AEGIS_RUN_INTEGRATION=1 uv run pytest -q tests/security/test_security_services.py -m 'integration and not database'
      - run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact --no-banner --config /repo/.gitleaks.toml
